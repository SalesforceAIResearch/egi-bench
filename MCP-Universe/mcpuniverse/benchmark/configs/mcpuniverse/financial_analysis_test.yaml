kind: llm
spec:
  name: llm-1
  type: openai
  config:
    model_name: gpt-4.1
    base_url: http://localhost:8008/v1
    api_key: unused
    temperature: 0.0
    max_completion_tokens: 4096

---
kind: agent
spec:
  name: FunctionCall-agent
  type: function_call
  config:
    llm: llm-1
    instruction: You are an agent for financial analysis. If you need to calculate the result, you can use the calculator tool.
    max_iterations: 20
    summarize_tool_response: false
    servers:
      - name: yfinance
      - name: calculator

---
kind: benchmark
spec:
  description: Quick test - 2 financial analysis tasks via the local LiteLLM proxy.
  agent: FunctionCall-agent
  tasks:
    - mcpuniverse/financial_analysis/yfinance_task_0001.json
    - mcpuniverse/financial_analysis/yfinance_task_0002.json
