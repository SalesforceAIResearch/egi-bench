kind: llm
spec:
  name: llm-1
  type: openai
  config:
    model_name: gpt-4.1
    base_url: http://localhost:8008/v1
    api_key: unused
    temperature: 0.0
    max_completion_tokens: 4096

---
kind: agent
spec:
  name: ReAct-agent
  type: react
  config:
    llm: llm-1
    instruction: You are an agent for location navigation.
    max_iterations: 20
    summarize_tool_response: false

---
kind: benchmark
spec:
  description: Quick test - 2 location navigation tasks via the local LiteLLM proxy.
  agent: ReAct-agent
  tasks:
    - mcpuniverse/location_navigation/google_maps_task_0001.json
    - mcpuniverse/location_navigation/google_maps_task_0002.json
