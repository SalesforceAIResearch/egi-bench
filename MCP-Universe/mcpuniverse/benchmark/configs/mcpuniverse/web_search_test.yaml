kind: llm
spec:
  name: llm-1
  type: openai
  config:
    model_name: claude-4-5-sonnet
    base_url: http://localhost:8001/v1
    api_key: unused
    temperature: 0.0
    max_completion_tokens: 4096
    reasoning_effort: low

---
kind: agent
spec:
  name: ReAct-agent
  type: react
  config:
    llm: llm-1
    instruction: You are an agent for web searching. If you don't have enough information to answer the question, you can use the google-search tool. If you want to obtain the information with a specific URL, you can use the fetch tool.
    max_iterations: 20
    summarize_tool_response: true

---
kind: benchmark
spec:
  description: Quick test - 3 web search tasks via the local LiteLLM proxy.
  agent: ReAct-agent
  tasks:
    - mcpuniverse/web_search/info_search_task_0001.json
    - mcpuniverse/web_search/info_search_task_0002.json
    - mcpuniverse/web_search/info_search_task_0003.json
